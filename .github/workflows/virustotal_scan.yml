# Upload release assets to VirusTotal so the VirusTotal column badges show results.
# Badge links already point at https://www.virustotal.com/gui/file/<sha256>/detection
# (SHA filled in by .github/scripts/fill_vt_sha256.py when the release notes are built).
# Pattern based on https://github.com/yuliskov/SmartTube/.github/workflows/virustotal_scan.yml
# API: https://docs.virustotal.com/reference/overview
name: VirusTotal Scan

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to scan (e.g. draft, v1.2.3)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to scan'
        required: true
        type: string

jobs:
  virustotal_scan:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}

    steps:
      - name: Set tag variable
        run: echo "TAG_NAME=${{ inputs.release_tag }}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_assets
          gh release download "$TAG_NAME" --dir release_assets \
            --pattern "Hiddify-*.apk" \
            --pattern "Hiddify-*.exe" \
            --pattern "Hiddify-*.Msix" \
            --pattern "Hiddify-*.msix" \
            --pattern "Hiddify-*.zip" \
            --pattern "Hiddify-*.dmg" \
            --pattern "Hiddify-*.pkg" \
            --pattern "Hiddify-*.AppImage" \
            --pattern "Hiddify-*.deb" \
            --pattern "Hiddify-*.rpm"
          ls -la release_assets

      - name: VirusTotal Scan
        if: ${{ env.HAS_VT_KEY == 'true' }}
        id: vt
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          files: |
            release_assets/*
          request_rate: 4

      - name: Refresh VirusTotal badge cache
        if: steps.vt.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting 150s for VirusTotal engines to report..."
          sleep 150

          gh release view "$TAG_NAME" --json body -q .body > release_notes.md || echo "" > release_notes.md
          stamp=$(date +%s)

          for file in release_assets/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            sha256=$(sha256sum "$file" | awk '{print $1}')
            badge="https://badges.cssnr.com/vt/id/${sha256}?start=green&end=red&n=8"
            echo "Purging badge cache for $filename ($sha256)"
            curl -s -X POST "$badge" || true

            python3 - "$sha256" "$stamp" <<'PY'
          import pathlib, re, sys
          sha256, stamp = sys.argv[1:3]
          path = pathlib.Path("release_notes.md")
          text = path.read_text()
          # Bust badge cache after engines finish (href already points at VirusTotal)
          text = re.sub(
              rf'src="https://badges\.cssnr\.com/vt/id/{re.escape(sha256)}\?[^"]*"',
              f'src="https://badges.cssnr.com/vt/id/{sha256}?start=green&end=red&n=8&v={stamp}"',
              text,
          )
          path.write_text(text)
          PY
          done

          gh release edit "$TAG_NAME" --notes-file release_notes.md
